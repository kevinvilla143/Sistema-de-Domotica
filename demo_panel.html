<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Domótica (demo)</title>
<style>
/* Panel Domótica — tokens */
:root {
  --bg: #e9f1ee;
  --surface: #ffffff;
  --surface-2: #f2f7f5;
  --line: #d3e0db;
  --text: #1f2d2a;
  --muted: #62756f;
  --amber: #ffd23f;
  --amber-ink: #3a2c00;
  --ok: #2f9e8a;
  --focus: #1b6b5c;
  --bad: #d4493f;
  --warn: #b7791f;
  --radius: 16px;
  --font: ui-rounded, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.4;
  /* Sin selección ni cursor de texto en la interfaz (solo en campos de formulario) */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  caret-color: transparent;
}
input { -webkit-user-select: text; user-select: text; caret-color: auto; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:disabled { cursor: default; opacity: .6; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Login ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login-card {
  width: min(100%, 380px); background: var(--surface); border: 1px solid var(--line);
  border-radius: 24px; padding: 32px 28px 28px;
}
.login-card h1 { font-size: 28px; letter-spacing: -.01em; margin-bottom: 4px; }
.login-card p.sub { color: var(--muted); font-size: 15px; margin-bottom: 24px; }
.field { display: block; margin-bottom: 16px; }
.field span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 13px 14px; font: inherit; font-size: 16px; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
}
.field input:focus { outline: 3px solid var(--focus); outline-offset: 1px; border-color: transparent; }
.btn-primary {
  width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 16px;
  background: var(--amber); color: var(--amber-ink); transition: transform .12s ease, filter .12s ease;
}
.btn-primary:active:not(:disabled) { transform: scale(.98); }
.form-error { min-height: 22px; margin: 4px 0 12px; font-size: 14px; color: var(--bad); }

/* ---------- Panel ---------- */
.app { max-width: 1040px; margin: 0 auto; padding: 20px 16px 40px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.brand h1 { font-size: 24px; letter-spacing: -.01em; }
.conn { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin-top: 2px; min-height: 20px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.off { background: var(--bad); }
.btn-ghost {
  padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px;
  background: var(--surface); transition: background .15s;
}
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }

.banner {
  display: none; margin-bottom: 18px; padding: 12px 16px; border-radius: 12px; font-size: 15px;
  background: color-mix(in srgb, var(--bad) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--bad) 50%, var(--line));
}
.banner.show { display: block; }

.layout { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 820px) {
  .layout { grid-template-columns: 1.15fr 1fr; align-items: start; }
  .col-main { grid-column: 1; }
  .col-side { grid-column: 2; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
.layout .card:last-child { margin-bottom: 0; }

/* Luces: los interruptores brillan en ámbar al encender */
.lights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.light {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 22px 8px 16px; border-radius: 20px; background: var(--surface-2); border: 1px solid var(--line);
  transition: background .25s, box-shadow .25s, border-color .25s, color .25s;
}
.light svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); transition: color .25s, fill .25s; }
.light .name { font-weight: 600; font-size: 15px; }
.light .state { font-size: 13px; color: var(--muted); min-height: 18px; }
.light[aria-checked="true"] {
  background: var(--amber);
  border-color: var(--amber);
  color: var(--amber-ink);
}
.light[aria-checked="true"] svg { color: var(--amber-ink); fill: rgba(255, 255, 255, .55); }
.light[aria-checked="true"] .state { color: var(--amber-ink); }
.light.busy { opacity: .7; }
.light:active:not(:disabled) { transform: scale(.98); }

/* Medidas */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.metric { background: var(--surface-2); border-radius: 14px; padding: 14px 14px 12px; min-width: 0; }
.metric .label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.metric .val { font-size: 28px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.metric .val small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.metric .hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; min-height: 18px; }

.battery { margin-bottom: 14px; }
.battery .row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.battery .pct { font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
.battery .volts { color: var(--muted); font-size: 15px; }
.bar { height: 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--ok); transition: width .6s ease, background .3s; }
.bar > i.low { background: var(--bad); }
.bar > i.mid { background: var(--warn); }

.alerts { color: var(--warn); font-size: 13px; margin-top: 10px; min-height: 18px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 24px; }

/* Diálogo de confirmación */
dialog { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--text); padding: 24px; width: min(92vw, 380px); margin: auto; }
dialog::backdrop { background: rgba(31, 45, 42, .35); }
dialog h3 { font-size: 18px; margin-bottom: 8px; }
dialog p { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
dialog .row { display: flex; gap: 10px; justify-content: flex-end; }
.btn-solid { padding: 10px 18px; border-radius: 12px; font-weight: 700; background: var(--amber); color: var(--amber-ink); }
.btn-solid.danger { background: var(--bad); color: #fff; }

.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: 14px; transition: all .25s; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 420px) {
  .lights { gap: 8px; }
  .light { padding: 18px 4px 14px; }
  .metric .val { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.alerts:empty { display: none; }

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Domótica</h1>
      <div class="conn"><span class="dot off" id="dot"></span><span id="connText">Conectando…</span></div>
    </div>
    <button class="btn-ghost" id="logout" type="button">Cerrar sesión</button>
  </header>

  <div class="banner" id="banner" role="status"></div>

  <div class="layout">
    <div class="col-main">
      <section class="card" aria-labelledby="hLuces">
        <h2 id="hLuces">Luces</h2>
        <div class="lights">
          <button class="light" id="luz1" type="button" role="switch" aria-checked="false" data-n="1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
            <span class="name">Luz 1</span><span class="state">Apagada</span>
          </button>
          <button class="light" id="luz2" type="button" role="switch" aria-checked="false" data-n="2">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
            <span class="name">Luz 2</span><span class="state">Apagada</span>
          </button>
          <button class="light" id="luz3" type="button" role="switch" aria-checked="false" data-n="3">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
            <span class="name">Luz 3</span><span class="state">Apagada</span>
          </button>
        </div>
      </section>

      <section class="card" aria-labelledby="hClima">
        <h2 id="hClima">Clima interior</h2>
        <div class="grid2">
          <div class="metric"><div class="label">Temperatura</div><div class="val num"><span id="temp">--</span><small>°C</small></div></div>
          <div class="metric"><div class="label">Humedad</div><div class="val num"><span id="hum">--</span><small>%</small></div></div>
        </div>
        <div class="alerts" id="dhtWarn"></div>
      </section>
    </div>

    <div class="col-side">
      <section class="card" aria-labelledby="hEnergia">
        <h2 id="hEnergia">Energía</h2>
        <div class="battery">
          <div class="row"><span class="pct num"><span id="bPct">--</span>%</span><span class="volts num">Batería · <span id="bV">--</span> V</span></div>
          <div class="bar" role="progressbar" aria-label="Carga de la batería" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="barFill"></i></div>
        </div>
        <div class="grid2">
          <div class="metric"><div class="label">Panel solar</div><div class="val num"><span id="pV">--</span><small>V</small></div><div class="hint" id="pEstado">&nbsp;</div></div>
          <div class="metric"><div class="label">Consumo</div><div class="val num"><span id="cW">--</span><small>W</small></div><div class="hint"><span id="cA" class="num">--</span> A</div></div>
        </div>
        <div class="alerts" id="acsWarn"></div>
      </section>

      <section class="card" aria-labelledby="hSistema">
        <h2 id="hSistema">Sistema</h2>
        <div class="actions">
          <a class="btn-ghost" id="cfgLink" href="#" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Configurar WiFi</a>
          <button class="btn-ghost" id="calib" type="button">Recalibrar corriente</button>
          <button class="btn-ghost btn-danger" id="reset" type="button">Restablecer WiFi</button>
        </div>
      </section>
    </div>
  </div>

  <div class="footer num" id="footer">&nbsp;</div>
</div>

<dialog id="dlg">
  <h3 id="dlgTitle"></h3>
  <p id="dlgText"></p>
  <div class="row">
    <button class="btn-ghost" type="button" id="dlgNo">Cancelar</button>
    <button class="btn-solid" type="button" id="dlgYes">Continuar</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script>
// ====== MODO DEMO: datos simulados, nada se conecta a ningún sitio ======
(() => {
  const luces = {luz1:true, luz2:false, luz3:false}; const t0 = Date.now(); let k = 0;
  const _fetch = window.fetch;
  window.fetch = async (url, opts = {}) => {
    const ok = (o, s = 200) => new Response(JSON.stringify(o), {status: s, headers: {'Content-Type':'application/json'}});
    await new Promise(r => setTimeout(r, 120));
    if (url === '/api/status') {
      k++; const w = Math.sin(k/6);
      return ok({online:true, temperatura:24.6+w, humedad:58+w*2, dht_ok:true,
        panel:{voltaje:12.3+w*.2, cargando:true}, bateria:{voltaje:8.4, porcentaje:62+w*2},
        carga:{watts:3.2+w*.3, corriente:.38+w*.03}, luces,
        alertas:{saturado:false, offset_ok:true}, sesion:true, rssi:-58, uptime:4000+(Date.now()-t0)/1000, esp_url:'#'});
    }
    if (url === '/api/light') { const b = JSON.parse(opts.body); luces['luz'+b.luz] = b.estado; return ok({ok:true}); }
    if (url === '/api/calibrar' || url === '/api/resetwifi') return ok({ok:true});
    if (url === '/logout') { document.title = 'Domótica (demo: aquí volverías al login)'; return ok({ok:true}); }
    return _fetch(url, opts);
  };
  const _r = location.replace.bind(location);
  location.replace = u => { if (u === '/login') alert('Demo: al cerrar sesión volverías a la pantalla de login.'); else _r(u); };
})();

(() => {
  const $ = id => document.getElementById(id);
  const H = { 'Content-Type': 'application/json', 'X-Requested-With': 'domotica' };
  const pendientes = new Set();   // luces con un cambio en curso: el sondeo no las pisa
  let luces = { luz1: false, luz2: false, luz3: false };

  // Si el navegador restaura la página desde caché (botón "atrás" tras cerrar sesión), recargar:
  // el servidor pedirá login otra vez.
  window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });

  const toLogin = () => location.replace('/login');
  async function api(path, opts = {}) {
    const r = await fetch(path, { cache: 'no-store', ...opts });
    if (r.status === 401) { toLogin(); throw new Error('sesion'); }
    return r;
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function confirmar(titulo, texto, peligro) {
    return new Promise(res => {
      const d = $('dlg');
      $('dlgTitle').textContent = titulo; $('dlgText').textContent = texto;
      $('dlgYes').className = 'btn-solid' + (peligro ? ' danger' : '');
      const fin = v => { d.close(); $('dlgYes').onclick = $('dlgNo').onclick = null; res(v); };
      $('dlgYes').onclick = () => fin(true); $('dlgNo').onclick = () => fin(false);
      d.oncancel = () => res(false);
      d.showModal();
    });
  }

  function pintarLuz(n, on) {
    const b = $('luz' + n);
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    b.querySelector('.state').textContent = on ? 'Encendida' : 'Apagada';
  }

  const f1 = (v, d = 1) => (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '--';

  function pintar(d) {
    const on = d.online !== false;
    $('dot').classList.toggle('off', !on);
    $('connText').textContent = on ? ('En línea' + (d.rssi ? ' · WiFi ' + d.rssi + ' dBm' : '')) : 'Sin conexión';
    const bn = $('banner');
    bn.classList.toggle('show', !on);
    if (!on) { bn.textContent = (d.error || 'No hay conexión con el ESP32') + '. Reintentando automáticamente…'; return; }

    $('temp').textContent = d.dht_ok ? f1(d.temperatura) : '--';
    $('hum').textContent = d.dht_ok ? f1(d.humedad) : '--';
    $('dhtWarn').textContent = d.dht_ok ? '' : 'El sensor de temperatura no está respondiendo.';

    $('pV').textContent = f1(d.panel.voltaje);
    $('pEstado').textContent = d.panel.cargando ? 'Cargando la batería' : 'Sin carga';
    $('bV').textContent = f1(d.bateria.voltaje);
    const pct = Math.max(0, Math.min(100, d.bateria.porcentaje));
    $('bPct').textContent = f1(pct, 0);
    const fill = $('barFill'); fill.style.width = pct + '%';
    fill.className = pct < 20 ? 'low' : pct < 50 ? 'mid' : '';
    $('bar').setAttribute('aria-valuenow', Math.round(pct));
    $('cW').textContent = f1(d.carga.watts);
    $('cA').textContent = f1(d.carga.corriente, 2);

    const w = [];
    if (d.alertas.saturado) w.push('Sensor saturado: la corriente supera lo que puede medir.');
    if (!d.alertas.offset_ok) w.push('La calibración del sensor de corriente está fuera de rango.');
    $('acsWarn').textContent = w.join(' ');

    for (let i = 1; i <= 3; i++) {
      if (pendientes.has(i)) continue;          // esa luz tiene un cambio en curso
      luces['luz' + i] = !!d.luces['luz' + i]; pintarLuz(i, luces['luz' + i]);
    }
    $('cfgLink').href = (d.esp_url || '#') + '/config';
    $('footer').textContent = 'Activo hace ' + Math.floor(d.uptime / 60) + ' min';
  }

  async function sondear() {
    try {
      const r = await api('/api/status');
      pintar(await r.json());
    } catch (e) {
      if (e.message !== 'sesion') pintar({ online: false, error: 'No hay conexión con el servidor' });
    }
  }

  async function alternar(n) {
    const b = $('luz' + n);
    if (pendientes.has(n)) return;
    pendientes.add(n); b.classList.add('busy');
    const nuevo = !luces['luz' + n];
    pintarLuz(n, nuevo);                      // respuesta inmediata
    try {
      const r = await api('/api/light', { method: 'POST', headers: H, body: JSON.stringify({ luz: n, estado: nuevo }) });
      if (!r.ok) throw new Error();
      luces['luz' + n] = nuevo;
    } catch (e) {
      if (e.message !== 'sesion') { pintarLuz(n, !nuevo); toast('No se pudo cambiar la Luz ' + n + '.'); }
    }
    b.classList.remove('busy'); pendientes.delete(n);
  }

  document.querySelectorAll('.light').forEach(b => b.addEventListener('click', () => alternar(+b.dataset.n)));

  $('calib').addEventListener('click', async () => {
    if (!await confirmar('Recalibrar corriente', 'Apaga todas las cargas antes de continuar. La medición tarda unos segundos.')) return;
    try {
      const r = await api('/api/calibrar', { method: 'POST', headers: H });
      toast(r.ok ? 'Sensor recalibrado.' : 'No se pudo recalibrar.'); sondear();
    } catch (e) {}
  });

  $('reset').addEventListener('click', async () => {
    if (!await confirmar('Restablecer WiFi', 'El ESP32 olvidará la red guardada y se reiniciará en modo configuración. Perderás el control remoto hasta volver a configurarlo.', true)) return;
    try {
      await api('/api/resetwifi', { method: 'POST', headers: H });
      toast('Reiniciando el ESP32…');
    } catch (e) {}
  });

  $('logout').addEventListener('click', async () => {
    $('logout').disabled = true;
    try { await fetch('/logout', { method: 'POST', headers: H, cache: 'no-store' }); } catch (e) {}
    toLogin();
  });

  setInterval(sondear, 2000);
  sondear();
})();

</script>
</body>
</html>
